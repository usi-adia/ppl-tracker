<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PPL Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1817" media="(prefers-color-scheme: dark)">
<meta name="description" content="6-day push/pull/legs bodyweight workout tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PPL">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1a1a'/%3E%3Ctext x='90' y='118' font-family='-apple-system,Arial' font-size='62' font-weight='700' fill='white' text-anchor='middle'%3EPPL%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a1a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='12' font-weight='700' fill='white' text-anchor='middle'%3EPPL%3C/text%3E%3C/svg%3E">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #fafaf7;
  color: #1a1a1a;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  min-height: 100vh;
}
.app { max-width: 720px; margin: 0 auto; padding: 1rem 1rem 3rem; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; gap: 12px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.reset-btn {
  font-size: 13px; padding: 8px 12px;
  border: 1px solid #e8e6df; background: transparent;
  border-radius: 8px; cursor: pointer; color: #6b6b6b;
  font-family: inherit; white-space: nowrap;
}
.reset-btn:active { background: #f0eee7; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; font-size: 13px; font-family: inherit;
  border: 1px solid #e8e6df; background: transparent;
  border-radius: 10px; cursor: pointer; color: #6b6b6b;
  min-height: 40px;
}
.tab.active { background: #fff; border-color: #d3d1c7; color: #1a1a1a; }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.tab .num { font-weight: 600; color: #1a1a1a; }
.ctrls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.summary { font-size: 13px; color: #6b6b6b; }
.summary b { color: #1a1a1a; font-weight: 600; }
.pb { height: 4px; background: #e8e6df; border-radius: 2px; margin-bottom: 1.25rem; overflow: hidden; }
.pf { height: 100%; background: #185fa5; transition: width 0.3s; width: 0%; }
.day-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.day-head .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.day-title { font-size: 18px; font-weight: 600; }
.day-sub { font-size: 13px; color: #6b6b6b; margin-bottom: 1rem; }
.ex {
  background: #fff; border: 1px solid #e8e6df;
  border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  transition: background 0.2s, border-color 0.2s;
}
.ex.done { background: rgba(24,95,165,0.04); border-color: rgba(24,95,165,0.18); }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.ex-name {
  font-size: 16px; font-weight: 500; color: #1a1a1a;
  text-decoration: none; display: inline-flex; align-items: baseline; gap: 6px;
}
.ex-name .ext { font-size: 12px; opacity: 0.5; }
.ex-name:hover { color: #185fa5; }
.ex-target { font-size: 13px; color: #6b6b6b; white-space: nowrap; padding-top: 2px; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.set { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.set-lbl { font-size: 11px; color: #95938c; }
.set .rm {
  position: absolute; top: -6px; right: -6px;
  width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid #e8e6df; background: #fff; color: #95938c;
  font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  display: none; align-items: center; justify-content: center;
  font-family: inherit;
}
.set.extra .rm { display: flex; }
.set .rm:active { background: #f0eee7; }
.add-set {
  height: 44px; min-width: 44px; padding: 0 12px;
  border: 1px dashed #d3d1c7; background: transparent;
  border-radius: 10px; cursor: pointer; color: #6b6b6b;
  font-size: 18px; font-family: inherit; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  align-self: flex-end; margin-bottom: 0;
}
.add-set:active { background: #f0eee7; }
.set input {
  width: 56px; height: 44px; text-align: center;
  font-size: 16px; font-weight: 500;
  border: 1px solid #e8e6df; border-radius: 10px;
  background: #fff; color: #1a1a1a; font-family: inherit;
  -webkit-appearance: none; appearance: none; -moz-appearance: textfield;
  transition: border-color 0.15s, background 0.15s;
}
.set input::-webkit-outer-spin-button,
.set input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set input:focus {
  outline: none; border-color: #185fa5;
  box-shadow: 0 0 0 3px rgba(24,95,165,0.15);
}
.set input:not(:placeholder-shown) {
  background: rgba(24,95,165,0.08);
  border-color: rgba(24,95,165,0.3);
  color: #185fa5;
}
.rest {
  padding: 3rem 1.5rem; text-align: center;
  background: #fff; border: 1px solid #e8e6df; border-radius: 12px;
}
.rest h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
.rest p { margin: 0; color: #6b6b6b; }

@media (prefers-color-scheme: dark) {
  body { background: #1a1817; color: #f5f3ee; }
  .set .rm { background: #2a2825; border-color: #3a3633; color: #a8a59f; }
  .set .rm:active { background: #3a3633; }
  .add-set { border-color: #4a4642; color: #a8a59f; }
  .add-set:active { background: #2a2825; }
  .tab { border-color: #3a3633; color: #a8a59f; }
  .tab.active { background: #252321; border-color: #4a4642; color: #f5f3ee; }
  .tab .num, .summary b { color: #f5f3ee; }
  .summary, .day-sub, .ex-target { color: #a8a59f; }
  .set-lbl { color: #807d76; }
  .pb { background: #2a2825; }
  .pf { background: #55b2ff; }
  .ex { background: #252321; border-color: #3a3633; }
  .ex.done { background: rgba(85,178,255,0.06); border-color: rgba(85,178,255,0.22); }
  .ex-name { color: #f5f3ee; }
  .ex-name:hover { color: #55b2ff; }
  .set input { background: #2a2825; border-color: #3a3633; color: #f5f3ee; }
  .set input:focus { border-color: #55b2ff; box-shadow: 0 0 0 3px rgba(85,178,255,0.2); }
  .set input:not(:placeholder-shown) {
    background: rgba(85,178,255,0.12); border-color: rgba(85,178,255,0.4); color: #55b2ff;
  }
  .rest { background: #252321; border-color: #3a3633; }
  .rest p { color: #a8a59f; }
  .reset-btn { border-color: #3a3633; color: #a8a59f; }
  .reset-btn:active { background: #2a2825; }
}

@media (max-width: 480px) {
  h1 { font-size: 20px; }
  .ex-top { flex-direction: column; gap: 4px; }
  .ex-target { padding-top: 0; }
  .set input { width: 52px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>PPL Tracker</h1>
    <button class="reset-btn" onclick="resetWeek()">↻ Reset week</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="ctrls"><div class="summary" id="summary">—</div></div>
  <div class="pb"><div class="pf" id="pf"></div></div>
  <div id="content"></div>
</div>

<script>
const days = [
  { id:'d1', name:'Push A', sub:'Chest · shoulders · triceps', color:'#7F77DD', exercises:[
    {n:'Standard push-ups', s:4, t:'10–15 reps', q:'push ups proper form'},
    {n:'Pike push-ups', s:3, t:'8–12 reps', q:'pike push up form'},
    {n:'Diamond push-ups', s:3, t:'8–12 reps', q:'diamond push up form'},
    {n:'Decline push-ups', s:3, t:'10–12 reps', q:'decline push up form'},
    {n:'Bench dips', s:3, t:'12–15 reps', q:'bench dip proper form'},
    {n:'Plank shoulder taps', s:3, t:'20 total', q:'plank shoulder tap form'},
  ]},
  { id:'d2', name:'Pull A', sub:'Back · rear delts · core', color:'#D85A30', exercises:[
    {n:'Doorway rows', s:4, t:'10–12 reps', q:'doorway row bodyweight'},
    {n:'Towel rows', s:3, t:'10–12 / side', q:'towel door row bodyweight'},
    {n:'Superman holds', s:3, t:'30 sec', q:'superman hold exercise'},
    {n:'Reverse snow angels', s:3, t:'12 reps', q:'reverse snow angel exercise'},
    {n:'Prone Y-raises', s:3, t:'12 reps', q:'prone y raise form'},
    {n:'Bird dog', s:3, t:'10 / side', q:'bird dog exercise form'},
  ]},
  { id:'d3', name:'Legs A', sub:'Quads · glutes · calves', color:'#1D9E75', exercises:[
    {n:'Bodyweight squats', s:4, t:'15–20 reps', q:'bodyweight squat form'},
    {n:'Reverse lunges', s:3, t:'10 / leg', q:'reverse lunge form'},
    {n:'Bulgarian split squats', s:3, t:'10 / leg', q:'bulgarian split squat bodyweight'},
    {n:'Glute bridges', s:3, t:'15 reps', q:'glute bridge form'},
    {n:'Calf raises', s:4, t:'20 reps', q:'standing calf raise form'},
    {n:'Wall sit', s:3, t:'45 sec', q:'wall sit form'},
  ]},
  { id:'d4', name:'Push B', sub:'Chest · shoulders · triceps', color:'#7F77DD', exercises:[
    {n:'Wide-grip push-ups', s:4, t:'10–15 reps', q:'wide grip push up form'},
    {n:'Hindu push-ups', s:3, t:'8–10 reps', q:'hindu push up form'},
    {n:'Archer push-ups', s:3, t:'5 / side', q:'archer push up form'},
    {n:'Pseudo planche push-ups', s:3, t:'6–8 reps', q:'pseudo planche push up form'},
    {n:'Wall handstand hold', s:3, t:'30 sec', q:'wall handstand hold beginner'},
    {n:'Commando plank to push-up', s:3, t:'8–10 reps', q:'commando plank push up'},
  ]},
  { id:'d5', name:'Pull B', sub:'Back · rear delts · core', color:'#D85A30', exercises:[
    {n:'Inverted rows (under table)', s:4, t:'8–10 reps', q:'inverted row under table bodyweight'},
    {n:'Towel face pulls', s:3, t:'12–15 reps', q:'towel face pull no equipment'},
    {n:'Prone cobra hold', s:3, t:'30 sec', q:'prone cobra hold exercise'},
    {n:'Prone W-raises', s:3, t:'12 reps', q:'prone w raise form'},
    {n:'Prone T-raises', s:3, t:'12 reps', q:'prone t raise form'},
    {n:'Doorway scapular pulls', s:3, t:'10 reps', q:'scapular retraction doorway'},
  ]},
  { id:'d6', name:'Legs B', sub:'Quads · glutes · calves', color:'#1D9E75', exercises:[
    {n:'Jump squats', s:4, t:'10 reps', q:'jump squat form'},
    {n:'Forward lunges', s:3, t:'10 / leg', q:'forward lunge form'},
    {n:'Cossack squats', s:3, t:'6 / side', q:'cossack squat form'},
    {n:'Single-leg glute bridges', s:3, t:'10 / leg', q:'single leg glute bridge form'},
    {n:'Single-leg calf raises', s:3, t:'15 / leg', q:'single leg calf raise form'},
    {n:'Pistol squat progressions', s:3, t:'5 / leg', q:'pistol squat progression beginner'},
  ]},
  { id:'d7', name:'Rest', sub:'Recovery day', color:'#888780', exercises:[] },
];

let progress = {};
let active = 0;
const KEY = 'ppl-tracker-v1';

const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load() {
  try { const r = localStorage.getItem(KEY); if (r) progress = JSON.parse(r); }
  catch(e) { progress = {}; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch(e) {} }

function renderTabs() {
  document.getElementById('tabs').innerHTML = days.map((d, i) =>
    `<button class="tab ${i===active?'active':''}" onclick="setDay(${i})">
       <span class="dot" style="background:${d.color}"></span>
       <span class="num">${i+1}</span>
       <span>${esc(d.name)}</span>
     </button>`
  ).join('');
}

function setDay(i) { active = i; renderTabs(); render(); }

function render() {
  const d = days[active];
  const c = document.getElementById('content');
  if (d.exercises.length === 0) {
    c.innerHTML = '<div class="rest"><h2>Rest day</h2><p>Sleep, hydrate, walk. Let the work compound.</p></div>';
    document.getElementById('pf').style.width = '0%';
    document.getElementById('summary').innerHTML = '<b>Rest day</b>';
    return;
  }
  let html = `<div class="day-head"><span class="dot" style="background:${d.color}"></span><div class="day-title">${esc(d.name)}</div></div><div class="day-sub">${esc(d.sub)}</div>`;
  d.exercises.forEach((ex, exi) => {
    const key = `${d.id}-${exi}`;
    const vals = progress[key] || [];
    const count = Math.max(ex.s, vals.length);
    const allDone = count > 0 && Array.from({length: count}).every((_, i) => vals[i] && vals[i] !== '');
    html += `<div class="ex ${allDone?'done':''}">
      <div class="ex-top">
        <a class="ex-name" href="${yt(ex.q)}" target="_blank" rel="noopener">${esc(ex.n)}<span class="ext">↗</span></a>
        <span class="ex-target">${count} × ${esc(ex.t)}</span>
      </div>
      <div class="sets">`;
    for (let si = 0; si < count; si++) {
      const v = vals[si] || '';
      const extra = si >= ex.s;
      html += `<div class="set${extra?' extra':''}">
        <span class="set-lbl">Set ${si+1}</span>
        <input type="number" inputmode="numeric" placeholder="—" value="${esc(v)}"
               oninput="update('${key}', ${si}, this.value)" />
        <button class="rm" title="Remove set" onclick="removeSet('${key}', ${si})">×</button>
      </div>`;
    }
    html += `<button class="add-set" title="Add set" onclick="addSet('${key}')">+</button>`;
    html += `</div></div>`;
  });
  c.innerHTML = html;
  updateProgress();
}

function update(key, si, val) {
  if (!progress[key]) progress[key] = [];
  progress[key][si] = val;
  save();
  updateProgress();
  refreshCards();
}

function addSet(key) {
  if (!progress[key]) progress[key] = [];
  progress[key].push('');
  save();
  render();
}

function removeSet(key, si) {
  if (!progress[key]) return;
  progress[key].splice(si, 1);
  if (progress[key].length === 0) delete progress[key];
  save();
  render();
}

function refreshCards() {
  const d = days[active];
  const cards = document.querySelectorAll('.ex');
  d.exercises.forEach((ex, exi) => {
    const key = `${d.id}-${exi}`;
    const vals = progress[key] || [];
    const count = Math.max(ex.s, vals.length);
    const allDone = count > 0 && Array.from({length: count}).every((_, i) => vals[i] && vals[i] !== '');
    if (cards[exi]) cards[exi].classList.toggle('done', allDone);
  });
}

function updateProgress() {
  const d = days[active];
  if (d.exercises.length === 0) return;
  let total = 0, done = 0;
  d.exercises.forEach((ex, exi) => {
    const key = `${d.id}-${exi}`;
    const vals = progress[key] || [];
    const count = Math.max(ex.s, vals.length);
    total += count;
    for (let si = 0; si < count; si++) if (vals[si] && vals[si] !== '') done++;
  });
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  document.getElementById('pf').style.width = pct + '%';
  document.getElementById('summary').innerHTML = `<b>${done}</b> of ${total} sets logged · <b>${pct}%</b>`;
}

function resetWeek() {
  if (!confirm('Clear all logged sets for the week?')) return;
  progress = {};
  try { localStorage.removeItem(KEY); } catch(e) {}
  render();
}

load();
renderTabs();
render();
</script>
</body>
</html>
